[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "telegram-personal-mcp"
version = "0.1.0"
description = "Self-hosted Telegram MCP with message search, replies and durable events"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
dependencies = ["mcp==2.3.0", "Telethon>=1.42,<2", "httpx>=0.28,<1", "uvicorn>=0.35,<1", "python-multipart>=0.0.20"]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]
[project.scripts]
telegram-personal-mcp = "telegram_dot.server:main"
telegram-personal-mcp-setup = "telegram_dot.setup:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
